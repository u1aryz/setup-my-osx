---
- name: miseをインストール
  community.general.homebrew:
    name: mise
    state: latest
    update_homebrew: true

- name: fish completionsのインストール先を作成
  ansible.builtin.file:
    path: "{{ mise_fish_completion_dir }}"
    state: directory
    mode: "0755"

- name: mise補完スクリプト(mise.fish)を生成する
  ansible.builtin.command:
    cmd: mise completion fish
  register: mise_completion_result
  changed_when: false
  check_mode: false

# miseの更新で補完スクリプトが変わった場合にも追従する
- name: mise補完スクリプト(mise.fish)を配置する
  ansible.builtin.copy:
    dest: "{{ mise_completion_file }}"
    content: "{{ mise_completion_result.stdout }}\n"
    mode: "0644"

- name: mise管理ツールを更新
  ansible.builtin.command:
    cmd: mise up
  register: mise_up_result
  changed_when: mise_up_result.stdout | length > 0
