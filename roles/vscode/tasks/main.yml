---
- name: vscodeをインストール
  community.general.homebrew_cask:
    name: visual-studio-code
    state: latest
    greedy: true
    install_options: "appdir=/Applications"

- name: vscodeのプラグインをインストール
  ansible.builtin.command: "code --install-extension {{ item }} --force"
  with_items: "{{ vscode_plugins }}"
  changed_when: false
