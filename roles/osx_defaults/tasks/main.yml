---
- name: Dock関連
  notify: Dockを再起動
  block:
    - name: Dockを自動的に隠す
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide
        type: bool
        value: true
    - name: Dockをdelayなしで表示・非表示させる
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide-delay
        type: float
        value: 0
    - name: Dockの表示アニメーションを0.7にする
      community.general.osx_defaults:
        domain: com.apple.dock
        key: autohide-time-modifier
        type: float
        value: 0.7
    - name: Dockをオンマウスでアイコンサイズをズームにする
      community.general.osx_defaults:
        domain: com.apple.dock
        key: magnification
        type: bool
        value: true
    - name: Dockのアイコン拡大サイズを110にする
      community.general.osx_defaults:
        domain: com.apple.dock
        key: largesize
        type: int
        value: 110
    - name: アプリの提案と最近使用したアプリをDockに表示しない
      community.general.osx_defaults:
        domain: com.apple.dock
        key: show-recents
        type: bool
        value: false

- name: Finder関連
  notify: Finderを再起動
  block:
    - name: 新規Finderウィンドウでホームフォルダを開く
      community.general.osx_defaults:
        domain: com.apple.finder
        key: NewWindowTarget
        type: string
        value: PfHm
    - name: Finderですべての拡張子を表示する
      community.general.osx_defaults:
        domain: NSGlobalDomain
        key: AppleShowAllExtensions
        type: bool
        value: true
    - name: Finderで拡張子の変更を警告しない
      community.general.osx_defaults:
        domain: com.apple.finder
        key: FXEnableExtensionChangeWarning
        type: bool
        value: false
    - name: Finderで検索対象のデフォルトをカレントディレクトリにする
      community.general.osx_defaults:
        domain: com.apple.finder
        key: FXDefaultSearchScope
        type: string
        value: SCcf
    - name: Finderで名前順のときにフォルダを先頭に表示する
      community.general.osx_defaults:
        domain: com.apple.finder
        key: _FXSortFoldersFirst
        type: bool
        value: true
    - name: Finderでパスバーを表示する
      community.general.osx_defaults:
        domain: com.apple.finder
        key: ShowPathbar
        type: bool
        value: true
    - name: Finderでステータスバーを表示する
      community.general.osx_defaults:
        domain: com.apple.finder
        key: ShowStatusBar
        type: bool
        value: true
    - name: Finderでタイトルをフルパス表示にする
      community.general.osx_defaults:
        domain: com.apple.finder
        key: _FXShowPosixPathInTitle
        type: bool
        value: true

# メニューバー関連
- name: メニューバーにバッテリー残量をパーセント表示する
  community.general.osx_defaults:
    host: currentHost
    domain: com.apple.controlcenter
    key: BatteryShowPercentage
    type: bool
    value: true
  notify: Control Centerを再起動

# トラックパッド関連
- name: Bluetoothトラックパッドのタップでクリックを有効にする
  community.general.osx_defaults:
    domain: com.apple.driver.AppleBluetoothMultitouch.trackpad
    key: Clicking
    type: int
    value: 1

- name: 内蔵トラックパッドのタップでクリックを有効にする
  community.general.osx_defaults:
    domain: com.apple.AppleMultitouchTrackpad
    key: Clicking
    type: int
    value: 1

- name: ホストごとのタップでクリックを有効にする
  community.general.osx_defaults:
    host: currentHost
    domain: NSGlobalDomain
    key: com.apple.mouse.tapBehavior
    type: int
    value: 1

# 保存値が既に一致していても、ログイン中のセッションへ再適用する
- name: トラックパッド設定を現在のセッションに反映する
  ansible.builtin.command:
    argv:
      - /System/Library/PrivateFrameworks/SystemAdministration.framework/Resources/activateSettings
      - -u
  changed_when: true

# キーボード関連
- name: フルキーボードアクセスを有効にする
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: AppleKeyboardUIMode
    type: int
    value: 3
- name: F1~F12を標準のファンクションキーとして使用
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: com.apple.keyboard.fnState
    type: bool
    value: true
- name: キーのリピート速度を30msにする
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: KeyRepeat
    type: int
    value: "{{ (30 / 15) | int }}"
- name: リピート入力認識までの時間を375msにする
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: InitialKeyRepeat
    type: int
    value: "{{ (375 / 15) | int }}"
- name: 日本語のライブ変換をONにする
  community.general.osx_defaults:
    domain: com.apple.inputmethod.Kotoeri
    key: JIMPrefLiveConversionKey
    type: bool
    value: true

# ショートカット関連（AppleSymbolicHotKeysは入れ子構造のためosx_defaultsでは設定できない）
# 注: この変更はログイン中のセッションには即時反映されないことがあり、再ログインが必要
- name: 「次のウィンドウを操作対象にする」ショートカットの現在値を確認
  ansible.builtin.shell: |
    set -o pipefail
    hotkeys="$(defaults export com.apple.symbolichotkeys - 2>/dev/null || true)"
    raw() { printf '%s' "$hotkeys" | plutil -extract "$1" raw -o - - 2>/dev/null; }
    id="AppleSymbolicHotKeys.{{ osx_defaults_move_focus_next_window_hotkey_id }}"
    [ "$(raw "$id.enabled")" = "true" ] &&
      [ "$(raw "$id.value.type")" = "standard" ] &&
      [ "$(raw "$id.value.parameters.0")" = "{{ osx_defaults_move_focus_next_window_parameters[0] }}" ] &&
      [ "$(raw "$id.value.parameters.1")" = "{{ osx_defaults_move_focus_next_window_parameters[1] }}" ] &&
      [ "$(raw "$id.value.parameters.2")" = "{{ osx_defaults_move_focus_next_window_parameters[2] }}" ]
  register: osx_defaults_move_focus_next_window
  changed_when: false
  failed_when: false

- name: 「次のウィンドウを操作対象にする」ショートカットを⌘`にする
  ansible.builtin.command:
    argv:
      - defaults
      - write
      - com.apple.symbolichotkeys
      - AppleSymbolicHotKeys
      - -dict-add
      - "{{ osx_defaults_move_focus_next_window_hotkey_id | string }}"
      - >-
        <dict><key>enabled</key><true/><key>value</key><dict><key>parameters</key>
        <array>{% for parameter in osx_defaults_move_focus_next_window_parameters %}<integer>{{ parameter }}</integer>{% endfor %}</array>
        <key>type</key><string>standard</string></dict></dict>
  when: osx_defaults_move_focus_next_window.rc != 0
  changed_when: true

# テキスト入力関連
- name: 自動スペル修正を無効にする
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticSpellingCorrectionEnabled
    type: bool
    value: false
- name: 自動大文字化を無効にする
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticCapitalizationEnabled
    type: bool
    value: false
- name: スマート引用符を無効にする
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticQuoteSubstitutionEnabled
    type: bool
    value: false
- name: スマートダッシュを無効にする
  community.general.osx_defaults:
    domain: NSGlobalDomain
    key: NSAutomaticDashSubstitutionEnabled
    type: bool
    value: false

# スクリーンキャプチャ関連
- name: スクリーンキャプチャに影を付けない
  community.general.osx_defaults:
    domain: com.apple.screencapture
    key: disable-shadow
    type: bool
    value: true

# 後続ロールの失敗で再起動が失われないよう、このロール内でhandlerを実行する
- name: 通知済みのhandlerを即時実行
  ansible.builtin.meta: flush_handlers
