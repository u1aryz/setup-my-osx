---
# nodeはmiseで管理する。nodeを明示して、未インストールの場合はnodeのみをインストールさせる
- name: インストール済みskillsを取得
  ansible.builtin.command:
    cmd: mise exec node -- npx --yes skills list -g --json
  register: skills_list_result
  changed_when: false
  check_mode: false

- name: インストール済みskills名を設定
  ansible.builtin.set_fact:
    skills_installed_names: "{{ (skills_list_result.stdout | from_json) | map(attribute='name') | list }}"

- name: skillsをインストール
  ansible.builtin.command:
    cmd: mise exec node -- npx --yes skills add {{ item.repo }} --skill {{ item.skill }} -y -g
  loop: "{{ skills_packages }}"
  when: item.skill not in skills_installed_names
  changed_when: true

- name: skillsを更新
  ansible.builtin.command:
    cmd: mise exec node -- npx --yes skills update {{ skills_packages | map(attribute='skill') | join(' ') }} -g -y
  register: skills_update_result
  changed_when: "'All global skills are up to date' not in skills_update_result.stdout"
