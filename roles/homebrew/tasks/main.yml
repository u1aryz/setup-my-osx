---
# caskのインストールにはsudoが必要なため、時間のかかる処理より前に確認する
- name: becomeパスワードが指定されていることを確認
  ansible.builtin.assert:
    that: ansible_become_pass | default('') | length > 0
    fail_msg: ansible_become_passが未指定です。非対話実行の場合は -e ansible_become_pass=... を指定してください

- name: homebrewをアップデート
  community.general.homebrew:
    update_homebrew: true

- name: サードパーティtapを追加
  community.general.homebrew_tap:
    name: "{{ item }}"
  with_items: "{{ homebrew_taps }}"

# Homebrewはサードパーティtapのformula・caskを信頼済みでないと読み込まない
- name: 信頼済みのサードパーティパッケージを取得
  ansible.builtin.command:
    cmd: brew trust --json=v1
  register: homebrew_trust_result
  changed_when: false
  check_mode: false

- name: 信頼済みのサードパーティパッケージを設定
  ansible.builtin.set_fact:
    homebrew_trusted: "{{ homebrew_trust_result.stdout | from_json }}"

- name: サードパーティformulaを信頼
  ansible.builtin.command:
    argv: [brew, trust, --formula, "{{ item }}"]
  loop: "{{ homebrew_packages | map(attribute='name') | select('search', '/') | reject('in', homebrew_trusted.formulae) | list }}"
  changed_when: true

- name: サードパーティcaskを信頼
  ansible.builtin.command:
    argv: [brew, trust, --cask, "{{ item }}"]
  loop: "{{ homebrew_cask_packages | map(attribute='name') | select('search', '/') | reject('in', homebrew_trusted.casks) | list }}"
  changed_when: true

- name: brewパッケージをインストール
  community.general.homebrew:
    name: "{{ item.name }}"
    state: latest
  with_items: "{{ homebrew_packages }}"

- name: caskパッケージをインストール
  community.general.homebrew_cask:
    name: "{{ item.name }}"
    state: latest
    # 自動更新機能を持つcaskも含め、毎回最新に更新する
    greedy: true
    install_options: "appdir=/Applications"
    sudo_password: "{{ ansible_become_pass }}"
  ignore_errors: true
  register: homebrew_cask_results
  with_items: "{{ homebrew_cask_packages }}"

- name: 失敗したcaskの一覧を集計
  ansible.builtin.set_fact:
    homebrew_cask_failed: "{{ homebrew_cask_results.results | selectattr('failed') | map(attribute='item.name') | list }}"

- name: インストールに失敗したcaskを警告表示
  ansible.builtin.debug:
    msg: "警告: 以下のcaskのインストールに失敗しました: {{ homebrew_cask_failed | join(', ') }}"
  when: homebrew_cask_failed | length > 0

- name: すべてのcaskが失敗した場合は中断
  ansible.builtin.fail:
    msg: すべてのcaskのインストールに失敗しました。becomeパスワードが正しいか確認してください
  when:
    - homebrew_cask_packages | length > 0
    - homebrew_cask_failed | length == homebrew_cask_packages | length
