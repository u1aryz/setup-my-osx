---
- name: macOSセットアップ
  hosts: localhost
  connection: local
  gather_facts: true
  # brew upgrade は、更新したformulaの依存パッケージが古いと、その依存先も更新する。
  # Homebrew版Ansibleはca-certificates等に依存しているため、実行中のAnsible自体が
  # 入れ替わって削除され、module_legacy_m2c の読み込みに失敗する。
  environment:
    HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"

  vars_prompt:
    - name: ansible_become_pass
      prompt: BECOME password
      private: true

  pre_tasks:
    - name: community.generalをインストール
      ansible.builtin.command:
        cmd: ansible-galaxy collection install -r requirements.yml -p ~/.ansible/collections
      changed_when: false
      delegate_to: localhost

  roles:
    - { role: fish, tags: fish }
    - { role: vscode, tags: vscode }
    - { role: dotfiles, tags: dotfiles }
    - { role: osx_defaults, tags: osx_defaults }
    - { role: homebrew, tags: homebrew }
    - { role: mise, tags: mise }
    - { role: herdr, tags: herdr }
    - { role: skills, tags: skills }
